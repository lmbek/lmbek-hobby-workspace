name: Enforce Squash Merge

on:
  pull_request:
    branches: [main]

jobs:
  squash-check:
    name: Squash merge policy
    runs-on: ubuntu-latest
    steps:
      - name: Check commit count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMITS=${{ github.event.pull_request.commits }}
          echo "PR has $COMMITS commit(s)."
          echo ""
          echo "ℹ️  This repository enforces squash merging to main."
          echo "   When merging, select 'Squash and merge' from the merge button dropdown."
          echo ""
          echo "   To enforce this automatically, enable it in repository settings:"
          echo "   Settings → General → Pull Requests → Allow squash merging (and disable other merge types)"
