---
# Switch all cloned repositories to their defined branch.
# Override with: ansible-playbook playbooks/checkout.yml -e branch=develop
- name: Checkout Branches
  hosts: localhost
  gather_facts: false

  vars:
    workspace_root: "{{ playbook_dir | dirname | dirname }}"
    definition_file: "{{ workspace_root }}/git-repositories/system-definition.yaml"
    branch: ""

  tasks:
    - name: Load system definition
      ansible.builtin.include_vars:
        file: "{{ definition_file }}"
        name: sysdef

    - name: Build repo list
      ansible.builtin.set_fact:
        repos: "{{ sysdef.repos | flatten_repos(workspace_root) }}"

    - name: Check which repos are cloned
      ansible.builtin.stat:
        path: "{{ item.target_path }}/.git"
      register: git_dirs
      loop: "{{ repos }}"
      loop_control:
        label: "{{ item.display_name }}"

    - name: Report not-cloned repos
      ansible.builtin.debug:
        msg: "⊘ {{ item.item.display_name }} (not cloned, skipping)"
      when: not item.stat.exists
      loop: "{{ git_dirs.results }}"
      loop_control:
        label: "{{ item.item.display_name }}"

    - name: Checkout defined branch
      ansible.builtin.command:
        cmd: "git checkout {{ branch if branch else item.item.version }}"
        chdir: "{{ item.item.target_path }}"
      when: item.stat.exists
      loop: "{{ git_dirs.results }}"
      loop_control:
        label: "{{ item.item.display_name }} → {{ branch if branch else item.item.version }}"
      register: checkout_results
      failed_when: false
      changed_when: "'Switched to' in (checkout_results.stderr | default(''))"

    - name: Fail if any checkout errors occurred
      ansible.builtin.fail:
        msg: "Some repositories failed to checkout. Check output above."
      when: checkout_results.results | default([]) | selectattr('rc', 'defined') | rejectattr('rc', 'eq', 0) | list | length > 0
