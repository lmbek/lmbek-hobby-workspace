---
# Fetch all remotes for every cloned repository.
- name: Fetch Repositories
  hosts: localhost
  gather_facts: false

  vars:
    workspace_root: "{{ playbook_dir | dirname | dirname }}"
    definition_file: "{{ workspace_root }}/git-repositories/system-definition.yaml"

  tasks:
    - name: Load system definition
      ansible.builtin.include_vars:
        file: "{{ definition_file }}"
        name: sysdef

    - name: Build repo list
      ansible.builtin.set_fact:
        repos: "{{ sysdef.repos | flatten_repos(workspace_root) }}"

    - name: Check which repos are cloned
      ansible.builtin.stat:
        path: "{{ item.target_path }}/.git"
      register: git_dirs
      loop: "{{ repos }}"
      loop_control:
        label: "{{ item.display_name }}"

    - name: Fetch cloned repositories
      ansible.builtin.command:
        cmd: git fetch --all --prune
        chdir: "{{ item.item.target_path }}"
      when: item.stat.exists
      loop: "{{ git_dirs.results }}"
      loop_control:
        label: "{{ item.item.display_name }}"
      register: fetch_results
      failed_when: false
      changed_when: false

    - name: Report skipped (not cloned)
      ansible.builtin.debug:
        msg: "⊘ {{ item.item.display_name }} (not cloned, skipping)"
      when: not item.stat.exists
      loop: "{{ git_dirs.results }}"
      loop_control:
        label: "{{ item.item.display_name }}"

    - name: Fail if any fetch errors occurred
      ansible.builtin.fail:
        msg: "Some repositories failed to fetch. Check output above."
      when: fetch_results.results | default([]) | selectattr('rc', 'defined') | rejectattr('rc', 'eq', 0) | list | length > 0
