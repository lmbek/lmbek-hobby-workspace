---
# Push local commits for all cloned repositories.
- name: Push Repositories
  hosts: localhost
  gather_facts: false

  vars:
    workspace_root: "{{ playbook_dir | dirname | dirname }}"
    definition_file: "{{ workspace_root }}/git-repositories/system-definition.yaml"

  tasks:
    - name: Load system definition
      ansible.builtin.include_vars:
        file: "{{ definition_file }}"
        name: sysdef

    - name: Build repo list
      ansible.builtin.set_fact:
        repos: "{{ sysdef.repos | flatten_repos(workspace_root) }}"

    - name: Push workspace repository
      ansible.builtin.shell: |
        do_push() {
          if ! git rev-parse --abbrev-ref --symbolic-full-name @{u} >/dev/null 2>&1; then
            branch=$(git symbolic-ref --short HEAD 2>/dev/null)
            if [ -n "$branch" ]; then
              git push -u origin "$branch" 2>&1
              return $?
            fi
          fi
          git push 2>&1
          return $?
        }
        output=$(do_push)
        rc=$?
        if [ $rc -ne 0 ] && echo "$output" | grep -qE 'fetch first|non-fast-forward'; then
          git fetch --all && git pull && do_push
          exit $?
        fi
        echo "$output"
        exit $rc
      args:
        chdir: "{{ workspace_root }}"
      register: ws_push
      failed_when: false
      changed_when: ws_push.rc == 0 and 'Everything up-to-date' not in (ws_push.stderr | default(''))

    - name: Check which repos are cloned
      ansible.builtin.stat:
        path: "{{ item.target_path }}/.git"
      register: git_dirs
      loop: "{{ repos }}"
      loop_control:
        label: "{{ item.display_name }}"

    - name: Check for outgoing commits
      ansible.builtin.command:
        cmd: git rev-list --count @{upstream}..HEAD
        chdir: "{{ item.item.target_path }}"
      when: item.stat.exists
      loop: "{{ git_dirs.results }}"
      loop_control:
        label: "{{ item.item.display_name }}"
      register: ahead_checks
      failed_when: false
      changed_when: false

    - name: Push repositories with outgoing commits
      ansible.builtin.shell: |
        do_push() {
          if ! git rev-parse --abbrev-ref --symbolic-full-name @{u} >/dev/null 2>&1; then
            branch=$(git symbolic-ref --short HEAD 2>/dev/null)
            if [ -n "$branch" ]; then
              git push -u origin "$branch" 2>&1
              return $?
            fi
          fi
          git push 2>&1
          return $?
        }
        output=$(do_push)
        rc=$?
        if [ $rc -ne 0 ] && echo "$output" | grep -qE 'fetch first|non-fast-forward'; then
          git fetch --all && git pull && do_push
          exit $?
        fi
        echo "$output"
        exit $rc
      args:
        chdir: "{{ item.item.item.target_path }}"
      when: >-
        item.item.stat.exists and
        (item.rc | default(1)) == 0 and
        (item.stdout | default('0') | int) > 0
      loop: "{{ ahead_checks.results }}"
      loop_control:
        label: "{{ item.item.item.display_name }}"
      register: push_results
      failed_when: false
      changed_when: push_results.rc == 0

    - name: Report nothing-to-push repos
      ansible.builtin.debug:
        msg: "✓ {{ item.item.item.display_name }} (nothing to push)"
      when: >-
        item.item.stat.exists and
        (item.rc | default(1)) == 0 and
        (item.stdout | default('0') | int) == 0
      loop: "{{ ahead_checks.results }}"
      loop_control:
        label: "{{ item.item.item.display_name }}"

    - name: Fail if any push errors occurred
      ansible.builtin.fail:
        msg: "Some repositories failed to push. Check output above."
      when: push_results.results | default([]) | selectattr('rc', 'defined') | rejectattr('rc', 'eq', 0) | list | length > 0
