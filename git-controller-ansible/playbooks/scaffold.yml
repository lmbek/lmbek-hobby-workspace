---
# Initialise .git and set remote origin for every repository without cloning.
- name: Scaffold Repositories
  hosts: localhost
  gather_facts: false

  vars:
    workspace_root: "{{ playbook_dir | dirname | dirname }}"
    definition_file: "{{ workspace_root }}/git-repositories/system-definition.yaml"

  tasks:
    - name: Load system definition
      ansible.builtin.include_vars:
        file: "{{ definition_file }}"
        name: sysdef

    - name: Build repo list
      ansible.builtin.set_fact:
        repos: "{{ sysdef.repos | flatten_repos(workspace_root) }}"

    - name: Ensure target directories exist
      ansible.builtin.file:
        path: "{{ item.target_path }}"
        state: directory
        mode: "0755"
      loop: "{{ repos }}"
      loop_control:
        label: "{{ item.display_name }}"

    - name: Check which repos are already initialised
      ansible.builtin.stat:
        path: "{{ item.target_path }}/.git"
      register: git_dirs
      loop: "{{ repos }}"
      loop_control:
        label: "{{ item.display_name }}"

    - name: Report already-initialised repos
      ansible.builtin.debug:
        msg: "✓ {{ item.item.display_name }} (already initialised)"
      when: item.stat.exists
      loop: "{{ git_dirs.results }}"
      loop_control:
        label: "{{ item.item.display_name }}"

    - name: Git init
      ansible.builtin.command:
        cmd: git init
        chdir: "{{ item.item.target_path }}"
      when: not item.stat.exists
      loop: "{{ git_dirs.results }}"
      loop_control:
        label: "{{ item.item.display_name }}"
      changed_when: true

    - name: Set remote origin
      ansible.builtin.command:
        cmd: "git remote add origin {{ item.item.repository }}"
        chdir: "{{ item.item.target_path }}"
      when: not item.stat.exists
      loop: "{{ git_dirs.results }}"
      loop_control:
        label: "{{ item.item.display_name }}"
      failed_when: false
      changed_when: true

    - name: Fetch from origin
      ansible.builtin.command:
        cmd: git fetch origin
        chdir: "{{ item.item.target_path }}"
      when: not item.stat.exists
      loop: "{{ git_dirs.results }}"
      loop_control:
        label: "{{ item.item.display_name }}"
      register: fetch_results
      failed_when: false
      changed_when: false

    - name: Set default branch
      ansible.builtin.shell:
        cmd: |
          default_branch=$(git remote show origin 2>/dev/null | grep 'HEAD branch' | awk '{print $NF}')
          if [ -n "$default_branch" ]; then
            git checkout -b "$default_branch" "origin/$default_branch" 2>/dev/null || git checkout "$default_branch" 2>/dev/null
          fi
        chdir: "{{ item.item.target_path }}"
      when: not item.stat.exists and (item.rc | default(1)) == 0
      loop: "{{ fetch_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.display_name | default('unknown') }}"
      failed_when: false
      changed_when: false
