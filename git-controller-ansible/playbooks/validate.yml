---
# Verify repos match the system definition (cloned, correct branch, clean).
- name: Repository Validation
  hosts: localhost
  gather_facts: false

  vars:
    workspace_root: "{{ playbook_dir | dirname | dirname }}"
    definition_file: "{{ workspace_root }}/git-repositories/system-definition.yaml"

  tasks:
    - name: Load system definition
      ansible.builtin.include_vars:
        file: "{{ definition_file }}"
        name: sysdef

    - name: Build repo list
      ansible.builtin.set_fact:
        repos: "{{ sysdef.repos | flatten_repos(workspace_root) }}"

    - name: Check which repos exist
      ansible.builtin.stat:
        path: "{{ item.target_path }}/.git"
      register: git_dirs
      loop: "{{ repos }}"
      loop_control:
        label: "{{ item.display_name }}"

    - name: Get current branch for cloned repos
      ansible.builtin.command:
        cmd: git rev-parse --abbrev-ref HEAD
        chdir: "{{ item.item.target_path }}"
      when: item.stat.exists
      loop: "{{ git_dirs.results }}"
      loop_control:
        label: "{{ item.item.display_name }}"
      register: branches
      failed_when: false
      changed_when: false

    - name: Check dirty status for cloned repos
      ansible.builtin.command:
        cmd: git status --porcelain
        chdir: "{{ item.item.target_path }}"
      when: item.stat.exists
      loop: "{{ git_dirs.results }}"
      loop_control:
        label: "{{ item.item.display_name }}"
      register: dirty_checks
      failed_when: false
      changed_when: false

    - name: Validate each repository
      ansible.builtin.debug:
        msg: >-
          {% set errors = [] %}
          {% for i in range(repos | length) %}
          {% set repo = repos[i] %}
          {% set cloned = git_dirs.results[i].stat.exists %}
          {% if not cloned %}
          [{{ repo.display_name }}] ✖ not cloned — run 'make -f Makefile-ansible clone'
          {% else %}
          {% set br = branches.results[i].stdout | default('unknown') | trim %}
          {% set is_dirty = (dirty_checks.results[i].stdout | default('') | trim | length) > 0 %}
          {% if br != repo.version %}
          [{{ repo.display_name }}] ⚠ branch mismatch: expected {{ repo.version }}, found {{ br }}
          {% endif %}
          {% if is_dirty %}
          [{{ repo.display_name }}] ⚠ uncommitted changes
          {% endif %}
          {% if br == repo.version and not is_dirty %}
          [{{ repo.display_name }}] ✓ OK
          {% endif %}
          {% endif %}
          {% endfor %}

    - name: Fail if any repos are not cloned
      ansible.builtin.fail:
        msg: "Some repositories are not cloned. Run 'make -f Makefile-ansible clone'."
      when: git_dirs.results | rejectattr('stat.exists') | list | length > 0
