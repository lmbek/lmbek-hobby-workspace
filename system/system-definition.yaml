# System Definition for Workspace Controller
system-version: 0.0.1

hooks:
    post-sync:
        - echo "Sync complete! You can now run 'up' to start the system."
    post-up:
        - echo "System is up! Checking connectivity..."

services:
    authentication-service:
        repository: ../workspace/services/authentication-service
        version: 0.0.1
        health-check: http://localhost:8081/health
    user-service:
        repository: ../workspace/services/user-service
        version: 0.0.1
        health-check: http://localhost:8082/health

infrastructure:
    repository: ../workspace/infrastructure
    version: 0.0.1

tools:
    repository: ../workspace/tools
    version: 0.0.1