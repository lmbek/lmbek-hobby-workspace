# System Definition for Workspace Controller
system-version: main

hooks:
    post-sync:
        - echo "Sync complete! You can now run 'up' to start the system."
    post-up:
        - echo "System is up! Checking connectivity..."

services:
    authentication-service:
        repository: ${WORKSPACE_ROOT}/workspace/services/authentication-service
        version: main
        health-check: http://localhost:8081/health
    user-service:
        repository: ${WORKSPACE_ROOT}/workspace/services/user-service
        version: main
        health-check: http://localhost:8082/health

infrastructure:
    repository: ${WORKSPACE_ROOT}/workspace/infrastructure
    version: main

tools:
    repository: ${WORKSPACE_ROOT}/workspace/tools
    version: main